<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 640px; height: 640px; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 36%, #5b3fa0 0%, #3d2775 48%, #1d1140 100%);
    font-family: Manrope, -apple-system, "Helvetica Neue", Arial, sans-serif; color: #fff;
  }
  .logo { text-align: center; transform: translateY(-4px); }
  .mark { display: block; width: 136px; height: 136px; margin: 0 auto; }
  .name { font-size: 112px; font-weight: 800; letter-spacing: -3px; line-height: 1; margin-top: 22px; }
  .kind { font-size: 26px; font-weight: 700; letter-spacing: 9px; padding-left: 9px; color: #cdbcff; margin-top: 18px; }
</style>
<body>
  <div class="logo">
    <!-- график вниз: конкурент снизил цену -->
    <svg class="mark" viewBox="0 0 28 28" aria-hidden="true">
      <rect x="3" y="3" width="22" height="22" rx="6" fill="#fff"/>
      <path d="M8 10.5l4.5 4.5 3-3 4.5 4.5M20 16.5v-4M20 16.5h-4" fill="none" stroke="#3d2775"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="name">Цены</div>
    <div class="kind">КОНКУРЕНТОВ</div>
  </div>
</body>
</html>
